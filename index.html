<style>
*{margin:0;padding:0;box-sizing:border-box}

.card-icon.red{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.card-icon.green{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.card-icon.purple{background:linear-gradient(135deg,#9b59b6,#8e44ad)}
.card-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.card-desc{font-size:13px;color:#64748b}
.card-arrow{margin-left:auto;color:#94a3b8;font-size:20px}
.footer{text-align:center;color:rgba(255,255,255,.5);font-size:12px;margin-top:24px}

</head>
